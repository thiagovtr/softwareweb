services:
  postgres:
    image: postgres:16

    container_name: softwareweb_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: softwareweb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend

    container_name: softwareweb_backend

    restart: always

    ports:
      - "3333:3333"

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  frontend:
    build: ./frontend

    container_name: softwareweb_frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: